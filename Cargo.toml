[workspace]
members = ["sdk/rust", "sources/fixture", "sources/aniworld"]
resolver = "3"
[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
[workspace.dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "=1.0.145", default-features = false, features = ["alloc"] }
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
