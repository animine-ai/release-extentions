name: AniWorld stable catalog publication
# Stable versions with the existing operator-held identity. Manual trust remains explicit.
# Signing secrets and historical key derivation stay unchanged for installed-source compatibility.
on:
  workflow_dispatch:
  push:
    branches:
      - stable
  schedule:
    # Only runs once this file is on the default branch. The index is valid for six days; republish at least that often.
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: private-preview-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CATALOG_BRANCH: catalog
      LEGACY_CATALOG_BRANCH: private-preview-catalog
      PREVIEW_KEY_SEED: ${{ secrets.PREVIEW_KEY_SEED }}
    steps:
      - name: Require the operator secret
        run: |
          if [ -z "$PREVIEW_KEY_SEED" ] || [ "${#PREVIEW_KEY_SEED}" -lt 32 ]; then
            echo "::error::Repository secret PREVIEW_KEY_SEED is missing or shorter than 32 characters. Create it once under Settings > Secrets and variables > Actions (64 random characters) and keep it: it is the only custody item of this private preview identity."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: extension
          ref: stable
      - name: Pinned toolchain and Python dependencies
        working-directory: extension
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 wasm32v1-none
          python3 -m pip install -r requirements.txt
          bash tools/install_binaryen.sh "$RUNNER_TEMP/ep03-binaryen"
          echo "$RUNNER_TEMP/ep03-binaryen/bin" >> "$GITHUB_PATH"
      - name: Catalog unit tests (no secret involved)
        working-directory: extension
        env:
          PREVIEW_KEY_SEED: ''
        run: python3 -m unittest tests.test_private_preview -v
      - name: Two independent clean AniWorld builds
        working-directory: extension
        env:
          PREVIEW_KEY_SEED: ''
        run: |
          cargo +1.95.0 test --locked --workspace
          bash tools/build_aniworld.sh build/aniworld-a
          bash tools/build_aniworld.sh build/aniworld-b
          cmp build/aniworld-a/wasm32v1-none/release/arex_aniworld.wasm build/aniworld-b/wasm32v1-none/release/arex_aniworld.wasm
      - name: Build, sign and verify the stable catalog
        id: chain
        working-directory: extension
        run: |
          set +x
          sequence="$(git rev-list --count HEAD)"
          version="$(cat sources/aniworld/VERSION)"
          source_commit="$(git rev-parse HEAD)"
          python3 tools/publish_catalog.py build \
            --module build/aniworld-a/wasm32v1-none/release/arex_aniworld.wasm \
            --output build/catalog \
            --source-repository "https://github.com/${{ github.repository }}" \
            --source-commit "$source_commit" \
            --release-sequence "$sequence" \
            --version "$version" \
            --origin https://raw.githubusercontent.com \
            --base-path "/${{ github.repository }}/${CATALOG_BRANCH}" | tee build/catalog-public.json
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
      - name: Publish the public catalog files
        env:
          PREVIEW_KEY_SEED: ''
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global user.name 'private-preview-publisher'
          git config --global user.email 'private-preview-publisher@users.noreply.github.com'
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          rm -rf catalog-branch
          if git ls-remote --exit-code --heads "$remote" "$CATALOG_BRANCH" >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch "$CATALOG_BRANCH" "$remote" catalog-branch
          else
            mkdir catalog-branch && cd catalog-branch && git init --quiet -b "$CATALOG_BRANCH" && git remote add origin "$remote" && cd ..
          fi
          # A stable version is immutable: a changed module/provenance requires a new version.
          version="$(cat extension/sources/aniworld/VERSION)"
          incoming="$(find extension/build/catalog/dist/de.aniworld/"$version" -name '*.arex' -printf '%f')"
          if [ -d "catalog-branch/dist/de.aniworld/$version" ]; then
            for existing in catalog-branch/dist/de.aniworld/"$version"/*.arex; do
              [ "$(basename "$existing")" = "$incoming" ] || { echo '::error::Stable version already published with different bytes; bump VERSION.'; exit 1; }
            done
          fi
          cp extension/build/catalog/root.json extension/build/catalog/index.json catalog-branch/
          cp -rn extension/build/catalog/dist catalog-branch/
          cp extension/docs/catalog.md catalog-branch/README.md
          cd catalog-branch
          git add -A
          git diff --cached --quiet || git commit --quiet -m "AniWorld catalog ${{ steps.chain.outputs.source_commit }}"
          git push --quiet origin "HEAD:${CATALOG_BRANCH}"
          # The old URL continues to deliver authenticated updates, keeping installed-source IDs and trust intact.
          cd "$GITHUB_WORKSPACE"
          git clone --quiet --depth 1 --branch "$LEGACY_CATALOG_BRANCH" "$remote" legacy-catalog
          cmp legacy-catalog/catalog/root.json extension/build/catalog/root.json
          cp extension/build/catalog/root.json extension/build/catalog/index.json legacy-catalog/catalog/
          cp -rn extension/build/catalog/dist legacy-catalog/catalog/
          cp extension/docs/catalog.md legacy-catalog/README.md
          rm -f legacy-catalog/README.txt
          cd legacy-catalog
          git add -A
          git diff --cached --quiet || git commit --quiet -m "Compatible AniWorld stable update ${{ steps.chain.outputs.source_commit }}"
          git push --quiet origin "HEAD:${LEGACY_CATALOG_BRANCH}"
      - name: Public summary
        run: |
          {
            echo '## AniWorld 1.0 stable catalog (public values only)'
            echo ''
            echo 'Add this source URL in the app, then compare the fingerprint in the dialog with the one below:'
            echo ''
            echo "    https://raw.githubusercontent.com/${{ github.repository }}/${CATALOG_BRANCH}"
            echo ''
            echo '```json'
            cat extension/build/catalog-public.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
