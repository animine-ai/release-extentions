name: EP04 de.aniworld v1 compatibility and proof
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ep03-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: extension
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: animine-ai/Anihyou
          ref: 18d80c3ab8fb7d7ecbf9e237cff85e8796deca05
          path: host
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.7.1'
      - name: Pinned toolchain and Python dependencies
        working-directory: extension
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 wasm32v1-none
          python3 -m pip install -r requirements.txt
          bash tools/install_binaryen.sh "$RUNNER_TEMP/ep03-binaryen"
          echo "$RUNNER_TEMP/ep03-binaryen/bin" >> "$GITHUB_PATH"
      - name: Cache pinned native compiler outputs
        id: native-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: extension/compatibility/native/target
          key: ep03-native-${{ runner.os }}-${{ hashFiles('extension/compatibility/native/Cargo.lock', 'extension/compatibility/native/Cargo.toml', 'extension/compatibility/host-source-lock.json') }}
      - name: Schemas, archive and trust vectors
        working-directory: extension
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/check_wire.py
      - name: Rust SDK and fixture unit tests
        working-directory: extension
        run: cargo +1.95.0 test --locked --workspace
      - name: Two independent clean fixture builds
        working-directory: extension
        run: |
          bash tools/build_fixture.sh build/clean-a
          bash tools/build_fixture.sh build/clean-b
          cmp build/clean-a/wasm32v1-none/release/arex_fixture.wasm build/clean-b/wasm32v1-none/release/arex_fixture.wasm
      - name: Two independent clean AniWorld builds
        working-directory: extension
        run: |
          bash tools/build_aniworld.sh build/aniworld-a
          bash tools/build_aniworld.sh build/aniworld-b
          cmp build/aniworld-a/wasm32v1-none/release/arex_aniworld.wasm build/aniworld-b/wasm32v1-none/release/arex_aniworld.wasm
          python3 tools/arex.py test-aniworld-chain --module build/aniworld-a/wasm32v1-none/release/arex_aniworld.wasm --output build/aniworld-chain --source-repository https://github.com/${{ github.repository }} --source-commit ${{ github.sha }}
          python3 tools/arex.py test-aniworld-chain --module build/aniworld-b/wasm32v1-none/release/arex_aniworld.wasm --output build/aniworld-chain-b --source-repository https://github.com/${{ github.repository }} --source-commit ${{ github.sha }}
          cmp build/aniworld-chain/aniworld-test.arex build/aniworld-chain-b/aniworld-test.arex
          python3 tools/arex.py verify-aniworld-chain build/aniworld-chain
      - name: Deterministic test packages and signed chains
        working-directory: extension
        env:
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 tools/arex.py test-chain --module build/clean-a/wasm32v1-none/release/arex_fixture.wasm --output build/test-chain --source-repository "$SOURCE_REPOSITORY" --source-commit "$SOURCE_COMMIT"
          python3 tools/arex.py test-chain --module build/clean-b/wasm32v1-none/release/arex_fixture.wasm --output build/test-chain-b --source-repository "$SOURCE_REPOSITORY" --source-commit "$SOURCE_COMMIT"
          cmp build/test-chain/fixture.arex build/test-chain-b/fixture.arex
          python3 fixtures/trust/generate.py build/test-chain
          python3 tools/arex.py verify-chain build/test-chain
          python3 tools/arex.py lint-repository --url https://packages.example.org/extensions --root build/test-chain/root.json --index build/test-chain/index.json --pin build/test-chain/test-pin.json --now 2026-09-29T12:00:00Z
      - name: Original production native feature validation and ABI execution
        # Filled from the immutable host source before compiling the cached harness.
        working-directory: extension
        run: |
          python3 compatibility/export_host.py ../host
          cargo +1.95.0 run --locked --release --manifest-path compatibility/native/Cargo.toml -- build/clean-a/wasm32v1-none/release/arex_fixture.wasm fixtures/wire build/wire
          python3 tools/check_wire.py
          python3 tools/aniworld_vectors.py
          cargo +1.95.0 run --locked --release --manifest-path compatibility/native/Cargo.toml -- build/aniworld-a/wasm32v1-none/release/arex_aniworld.wasm build/aniworld-inputs build/aniworld-wire
      - name: Differential vectors for publisher tool versus original host verifiers
        working-directory: extension
        run: python3 tools/differential_vectors.py build/diff build/clean-a/wasm32v1-none/release/arex_fixture.wasm
      - name: Original Kotlin package, root, index, install and wire verifiers
        working-directory: extension
        run: gradle -p compatibility/host --console=plain test
      - name: Save pinned native compiler outputs
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: extension/compatibility/native/target
          key: ep03-native-${{ runner.os }}-${{ hashFiles('extension/compatibility/native/Cargo.lock', 'extension/compatibility/native/Cargo.toml', 'extension/compatibility/host-source-lock.json') }}
      - name: Artifact digest inventory
        if: success()
        working-directory: extension
        run: |
          python3 tools/report.py
      - name: Upload fixture and verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ep04-aniworld-evidence
          path: |
            extension/build/aniworld-inputs/
            extension/build/aniworld-wire/
            extension/build/aniworld-chain/
            extension/build/test-chain/
            extension/build/wire/
            extension/build/report.json
            extension/build/SHA256SUMS
            extension/compatibility/host/build/reports/tests/
            extension/compatibility/host/build/test-results/
          if-no-files-found: warn
          retention-days: 30

  android-proof:
    needs: verify
    name: EP04 Android de.aniworld production-runtime proof
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: extension
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: animine-ai/Anihyou
          ref: 18d80c3ab8fb7d7ecbf9e237cff85e8796deca05
          path: host
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install compile SDK
        run: android sdk install platforms/android-37.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Build real de.aniworld guest and hermetic inputs
        working-directory: extension
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 wasm32v1-none
          bash tools/install_binaryen.sh "$RUNNER_TEMP/ep04-binaryen"
          export PATH="$RUNNER_TEMP/ep04-binaryen/bin:$PATH"
          bash tools/build_aniworld.sh build/aniworld-android
          python3 tools/aniworld_vectors.py build/aniworld-inputs
          python3 -m pip install -r requirements.txt
          python3 tools/arex.py test-aniworld-chain --module build/aniworld-android/wasm32v1-none/release/arex_aniworld.wasm --output build/aniworld-chain --source-repository https://github.com/${{ github.repository }} --source-commit ${{ github.sha }}
      - name: Build production Android runtime proof APK
        run: |
          cd host
          bash tools/ep02-android/build-native.sh
          mkdir -p tools/ep02-android/host-app/src/main/jniLibs/x86_64 tools/ep02-android/host-app/src/main/jniLibs/arm64-v8a
          cp tools/ep02-android/native-out/x86_64/libarex_runtime.so tools/ep02-android/host-app/src/main/jniLibs/x86_64/
          cp tools/ep02-android/native-out/arm64-v8a/libarex_runtime.so tools/ep02-android/host-app/src/main/jniLibs/arm64-v8a/
          bash tools/ep02-android/generate-test-https-material.sh
          bash tools/ep02-android/build-fixture.sh
          mkdir -p tools/ep02-android/host-app/src/main/assets
          cp ../extension/build/aniworld-android/wasm32v1-none/release/arex_aniworld.wasm tools/ep02-android/host-app/src/main/assets/aniworld.wasm
          cp ../extension/sources/aniworld/fixtures/recent.html tools/ep02-android/host-app/src/main/assets/aniworld-recent.html
          cp ../extension/sources/aniworld/fixtures/episode.html tools/ep02-android/host-app/src/main/assets/aniworld-episode.html
          cp -R ../extension/build/aniworld-inputs tools/ep02-android/host-app/src/main/assets/aniworld-inputs
          cp -R ../extension/build/aniworld-chain tools/ep02-android/host-app/src/main/assets/aniworld-chain
          printf '%s\n' "$GITHUB_SHA" > tools/ep02-android/host-app/src/main/assets/aniworld-source-commit.txt
          ./gradlew --console=plain --stacktrace :tools:ep02-runtime-app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start hermetic DNS route
        run: |
          sudo ip address add 8.8.8.8/32 dev lo
          sudo python3 -u host/tools/ep02-android/test-dns-server.py "$RUNNER_TEMP/ep04-dns-ready" > "$RUNNER_TEMP/ep04-dns.log" 2>&1 &
          for attempt in {1..10}; do
            if [[ -f "$RUNNER_TEMP/ep04-dns-ready" ]]; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ep04-dns.log"
          exit 1
      - name: Execute Kotlin App to ExtensionRuntime to Wasmtime to de.aniworld
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none -dns-server 127.0.0.1
          script: cd host && bash tools/ep02-android/run-device.sh debug 35
      - name: Require exact real-guest Android evidence
        run: python3 extension/tools/verify_aniworld_android.py host/tools/ep02-android/results/android-35-debug/report.json extension/build/aniworld-android/wasm32v1-none/release/arex_aniworld.wasm "$GITHUB_SHA" extension/build/aniworld-inputs/cases.json
      - name: Stop hermetic DNS route
        if: always()
        run: |
          if [[ -s "$RUNNER_TEMP/ep04-dns-ready" ]]; then
            sudo kill "$(cat "$RUNNER_TEMP/ep04-dns-ready")" 2>/dev/null || true
          fi
          sudo ip address del 8.8.8.8/32 dev lo 2>/dev/null || true
      - name: Collect EP04 Android proof
        if: always()
        run: |
          mkdir -p host/tools/ep02-android/results/ep04-android
          timeout 15 adb logcat -d > host/tools/ep02-android/results/ep04-android/logcat.txt 2>&1 || true
          sha256sum extension/build/aniworld-android/wasm32v1-none/release/arex_aniworld.wasm > host/tools/ep02-android/results/ep04-android/aniworld-wasm.sha256
      - name: Upload EP04 Android evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ep04-android-aniworld-proof
          path: |
            host/tools/ep02-android/host-app/build/outputs/apk/debug/
            host/tools/ep02-android/results/ep04-android/
            host/tools/ep02-android/results/android-35-debug/report.json
            host/tools/ep02-android/results/android-35-debug/instrumentation.txt
            host/tools/ep02-android/results/android-35-debug/performance-raw.json
            extension/build/aniworld-inputs/
          if-no-files-found: warn
          retention-days: 30
